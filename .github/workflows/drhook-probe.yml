# ADR-016: a DrHook probe on the six runners. Started by hand only, choosing the probe:
#   101-platform-facts  Step 1, read-only: attaches to an idle target, records the debugger code loaded, how mscordbi
#                       reads the target's memory and the environment, detaches and lets the target end by itself.
#   102-natural-end     Step 2: targets that end by themselves, or after the debugger has left, 20 sessions per
#                       construction and read path in one process each, then a final attach.
#   100-crash-boundary  Step 4 (finding 104): a flooding target killed while synchronized, or crashing by itself
#                       (FailFast, stack overflow, a native fault, abort()), with the session ended at the crash's stop
#                       or every stop continued; each run in a process of its own, then a second attach. 10 runs per
#                       mode. A hang stays in the probe's own child process, which the probe ends.
# Each runner uploads the probe's facts as JSON (probe 100: its output as text). Its own concurrency group, so a push
# never cancels it and it never cancels a test run.
name: DrHook probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Probe to run
        required: true
        type: choice
        options:
          - 101-platform-facts
          - 102-natural-end
          - 100-crash-boundary

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ inputs.probe }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.probe == '100-crash-boundary' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS arm64, runner: macos-latest, file: macos-arm64 }
          - { platform: macOS x64, runner: macos-26-intel, file: macos-x64 }
          - { platform: Linux x64, runner: ubuntu-24.04, file: linux-x64 }
          - { platform: Linux arm64, runner: ubuntu-24.04-arm, file: linux-arm64 }
          - { platform: Windows x64, runner: windows-latest, file: windows-x64 }
          - { platform: Windows arm64, runner: windows-11-arm, file: windows-arm64 }
    env:
      PROBE: ${{ inputs.probe }}
      FILE: ${{ matrix.file }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Probe
        if: inputs.probe != '100-crash-boundary'
        working-directory: poc/drhook-engine
        shell: bash
        run: dotnet run --no-cache "$PROBE-smoke.cs" --out "probe-$PROBE-$FILE.json"

      - name: Probe 100, the crash boundary
        if: inputs.probe == '100-crash-boundary'
        working-directory: poc/drhook-engine
        shell: bash
        run: |
          set -o pipefail
          modes="flood-sync-kill flood-crash-kill flood-crash-detach flood-stackoverflow-kill flood-stackoverflow-detach"
          modes="$modes measure-crash measure-stackoverflow measure-segv measure-abort"
          dotnet run --no-cache 100-orphaned-read-smoke.cs 10 $modes 2>&1 | tee "probe-$PROBE-$FILE.txt"

      - name: Upload the facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ inputs.probe }}-${{ matrix.file }}
          path: |
            poc/drhook-engine/probe-${{ inputs.probe }}-${{ matrix.file }}.json
            poc/drhook-engine/probe-${{ inputs.probe }}-${{ matrix.file }}.txt
          if-no-files-found: warn
