# Builds the solution and runs every test project on each platform Sky Omega supports.
# The five machines in STATISTICS.md cover macOS arm64, Linux x64 and arm64, and Windows arm64;
# these runners add Windows x64 and macOS x64, and a second Linux distribution version.
# A separate job checks that SkyOmega.sln lists every ADR in docs/adrs.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels another run: two hosts (and two agents) push to main, and a later push
# used to cancel the earlier one's Windows jobs about 40 minutes in. Each push gets its own group (its
# commit). A pull request still cancels its own older run when a new commit is pushed to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The solution's ADR folders are kept by hand. This fails when an ADR in docs/adrs is missing from SkyOmega.sln, sits
  # in the wrong folder, or is listed but no longer exists (tools/check-solution-adrs.cs).
  solution-adrs:
    name: Solution lists every ADR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check SkyOmega.sln against docs/adrs
        run: dotnet run tools/check-solution-adrs.cs

  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-latest
          - platform: macOS x64
            runner: macos-26-intel
          - platform: Linux x64
            runner: ubuntu-24.04
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
          - platform: Windows x64
            runner: windows-latest
          - platform: Windows arm64
            runner: windows-11-arm
    steps:
      - name: Check out, with the W3C test suites
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Microsoft's build of .NET on every platform. On Linux the distribution's package links
      # the system libunwind and crashes intermittently (docs/operations/runbook-linux-dotnet-runtime.md).
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET
        run: dotnet --info

      # The tests' stores go under the temporary directory, and on the Windows runners that is on C:, where a write
      # costs ten times what it costs on the runner's local disk: one insert 16.5 to 25.5 ms against 1.6 ms, and
      # Mercury.Tests 29 to 38 minutes against 7 on Windows x64 (ADR-067 Q6, tools/probes/runner-flush-cost). The x64
      # runner's local disk is D:. The arm64 runner's is an NVMe disk with no partition: it is given one and mounted
      # as a folder on C:, so the temporary directory stays on the checkout's drive, as on x64 (a test opens a store by
      # its path relative to the working directory, and between two drives there is none). A runner with neither keeps
      # C:, with a warning.
      - name: The temporary directory on the runner's local disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'D:\') {
            $root = 'D:\'
          } elseif ($disk = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Select-Object -First 1) {
            Initialize-Disk -Number $disk.Number -PartitionStyle GPT
            $partition = New-Partition -DiskNumber $disk.Number -UseMaximumSize
            Format-Volume -Partition $partition -FileSystem NTFS -NewFileSystemLabel 'Local disk' -Confirm:$false | Out-Null
            $root = (New-Item -ItemType Directory 'C:\local-disk').FullName + '\'
            Add-PartitionAccessPath -DiskNumber $disk.Number -PartitionNumber $partition.PartitionNumber -AccessPath $root
            "$($disk.FriendlyName), $([int]($disk.Size / 1GB)) GB, mounted at $root"
          } else {
            "::warning::No local disk on this runner: the tests' temporary directory stays on C:, where a write is slow."
            exit 0
          }
          $temp = (New-Item -ItemType Directory (Join-Path $root 'temp')).FullName
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
          "The tests' temporary directory: $temp"

      # global.json selects Microsoft.Testing.Platform, so this runs every test project in the solution.
      # No report switch: xunit projects take --report-xunit-trx and the MSTest projects --report-trx,
      # and a project given the other one runs nothing and exits with code 5.
      - name: Test
        if: runner.os != 'macOS'
        run: dotnet test

      # macOS only, temporary: on the macOS runners a DrHook integration test hangs inside an attach, and every
      # attach and launch after it hangs too (ADR-007, Phase 8 note, 2026-10-30). The watcher records the stacks
      # of the integration-test host and its debug targets once the host has run 90 s, and 3 minutes later.
      - name: Install dotnet-stack
        if: runner.os == 'macOS'
        run: dotnet tool install --global dotnet-stack

      - name: Test, with the DrHook hang watcher
        if: runner.os == 'macOS'
        run: |
          tools/watch-drhook-hang.sh "$RUNNER_TEMP/drhook-hang" 90 "$HOME/.dotnet/tools/dotnet-stack" > "$RUNNER_TEMP/drhook-hang.log" 2>&1 &
          watcher=$!
          status=0
          dotnet test || status=$?
          kill "$watcher" 2> /dev/null || true
          exit "$status"

      - name: Show the hang watcher's managed stacks
        if: always() && runner.os == 'macOS'
        run: |
          cat "$RUNNER_TEMP/drhook-hang.log" 2> /dev/null || true
          for f in "$RUNNER_TEMP"/drhook-hang/*-stack-*.txt; do
            [ -e "$f" ] || { echo "No stacks recorded: no DrHook integration-test host ran 90 s."; break; }
            echo "=== $(basename "$f")"
            cat "$f"
          done

      - name: Upload the hang watcher's stacks
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: drhook-hang-${{ matrix.runner }}
          path: ${{ runner.temp }}/drhook-hang
          if-no-files-found: ignore
